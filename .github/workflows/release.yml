#
# Release workflow — triggered by version tags (v*).
# Builds artifacts, generates changelog via git-cliff, creates a GitHub Release,
# and produces SLSA provenance attestations.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build
        run: |
          cd src/interface/ffi
          zig build -Doptimize=ReleaseFast

      - name: Package release artifacts
        run: |
          mkdir -p release-artifacts
          cp src/interface/ffi/zig-out/bin/gsa release-artifacts/
          cp src/interface/ffi/zig-out/lib/libgsa.so release-artifacts/ 2>/dev/null || true
          tar -czf release-artifacts/gsa-linux-x86_64.tar.gz -C release-artifacts gsa

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 5

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.cliff.outputs.content }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/latest/download/git-cliff-$(uname -m)-unknown-linux-gnu.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin/ git-cliff-*/git-cliff

      - name: Generate changelog for this release
        id: cliff
        run: |
          # Generate changelog for the current tag only
          CHANGELOG=$(git cliff --latest --strip header)
          # Write to output using delimiter to handle multiline
          {
            echo "content<<CLIFF_EOF"
            echo "$CHANGELOG"
            echo "CLIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update full CHANGELOG.md
        run: |
          git cliff --output CHANGELOG.md

      - name: Upload updated CHANGELOG.md
        uses: actions/upload-artifact@v7.0.1
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [build, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-artifacts
          path: artifacts/

      - name: Create GitHub Release
        # softprops/action-gh-release is not from a hyperpolymath-owned,
        # GitHub-created or Marketplace-verified-creator repo, so the allow-list
        # rejects the action and the workflow dies with startup_failure
        # (game-server-admin#103). `gh release create` covers the same ground and
        # `gh` is preinstalled on every runner.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ needs.changelog.outputs.changelog }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            *-rc*|*-beta*|*-alpha*) prerelease=(--prerelease) ;;
            *)                      prerelease=() ;;
          esac
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}" \
            artifacts/gsa-linux-x86_64.tar.gz

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            artifacts/gsa-linux-x86_64.tar.gz

  provenance:
    name: SLSA Provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA generator must run in a separate, isolated workflow
    # See: https://slsa.dev/spec/v1.0/requirements#build-l3
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      # Generate with: sha256sum artifact | base64 -w0
