# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync

on:
  push:
    branches: [main, master]
  release:
    types: [published]

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Presence gate: the `secrets` context is not available in `if:`, so map
    # the token to a job-level env var and skip the dispatch when it is unset
    # (e.g. on forks) rather than invoking the secret-consuming action with an
    # empty token. (Hypatia workflow_audit: secret_action_without_presence_gate)
    env:
      FARM_DISPATCH_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN }}
    steps:
      - name: Trigger Propagation
        if: ${{ env.FARM_DISPATCH_TOKEN != '' }}
        # peter-evans/repository-dispatch is not from a hyperpolymath-owned,
        # GitHub-created or Marketplace-verified-creator repo, so the allow-list
        # rejects the action and the workflow dies with startup_failure
        # (game-server-admin#103). The dispatch endpoint is one POST; `gh` is
        # preinstalled on every runner, so no action is needed at all.
        env:
          GH_TOKEN: ${{ env.FARM_DISPATCH_TOKEN }}
          DISPATCH_REPO: hyperpolymath/.git-private-farm
          SRC_REPO: ${{ github.event.repository.name }}
          SRC_REF: ${{ github.ref }}
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repo "$SRC_REPO" \
            --arg ref  "$SRC_REF" \
            --arg sha  "$SRC_SHA" \
            '{event_type: "propagate",
              client_payload: {repo: $repo, ref: $ref, sha: $sha, forges: ""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${DISPATCH_REPO}/dispatches" \
                --input -
          echo "::notice::Propagation dispatched to ${DISPATCH_REPO}"

      - name: Confirm
        if: ${{ env.FARM_DISPATCH_TOKEN != '' }}
        run: echo "::notice::Propagation triggered for ${{ github.event.repository.name }}"
